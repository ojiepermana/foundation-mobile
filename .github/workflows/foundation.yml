name: Mobile foundation

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      derived:
        description: Build and test both apps under a sample product identity
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Build locked workspace
        run: cargo build --locked --workspace
      - name: Test Rust and verify contracts, resources and architecture
        run: scripts/test.sh

  ios:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Apple targets
        run: rustup target add aarch64-apple-ios-sim aarch64-apple-ios x86_64-apple-ios
      - name: Derive a sample product from this checkout
        if: ${{ inputs.derived }}
        run: |
          state=$(scripts/init-project.sh --check)
          if [[ "$state" == foundation ]]; then
            scripts/init-project.sh --name "Zoë's Proof" --app-id dev.example.derived
          else
            echo "This proof is for the foundation repository only. This checkout is $state."
          fi
      - name: Build for Simulator
        run: scripts/build-ios.sh simulator
      - name: Compare the built app with the identity file
        run: |
          identity=apps/ios/Config/Identity.xcconfig
          plist=build/ios/Build/Products/Debug-iphonesimulator/MobileFoundation.app/Info.plist
          expected_id=$(sed -n 's/^APP_BUNDLE_IDENTIFIER = //p' "$identity")
          expected_name=$(sed -n 's/^APP_DISPLAY_NAME = //p' "$identity")
          actual_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")
          actual_name=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$plist")
          echo "Identity file: $expected_id, $expected_name"
          echo "Built app: $actual_id, $actual_name"
          test -n "$expected_id" && test -n "$expected_name"
          test "$actual_id" = "$expected_id" && test "$actual_name" = "$expected_name"
      - name: Verify device linkage without signing
        run: scripts/build-ios.sh device
      - name: Run the greeting on an iPhone simulator
        run: |
          udid=$(xcrun simctl create FoundationSmoke 'iPhone 17' com.apple.CoreSimulator.SimRuntime.iOS-26-5)
          xcrun simctl bootstatus "$udid" -b
          for appearance in light dark; do
            xcrun simctl ui "$udid" appearance "$appearance"
            xcrun simctl shutdown "$udid"
            xcrun simctl bootstatus "$udid" -b
            test "$(xcrun simctl ui "$udid" appearance)" = "$appearance"
            scripts/build-ios.sh test "$udid" "$appearance"
          done

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools
      - name: Install Android SDK and Rust targets
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          rustup target add aarch64-linux-android x86_64-linux-android
      - name: Derive a sample product from this checkout
        if: ${{ inputs.derived }}
        run: |
          state=$(scripts/init-project.sh --check)
          if [[ "$state" == foundation ]]; then
            scripts/init-project.sh --name "Zoë's Proof" --app-id dev.example.derived
          else
            echo "This proof is for the foundation repository only. This checkout is $state."
          fi
      - name: Assemble app and instrumentation tests
        run: scripts/build-android.sh :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Compare the built app with the identity file
        run: |
          identity=apps/android/identity.properties
          apk=apps/android/app/build/outputs/apk/debug/app-debug.apk
          badging=$("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$apk")
          expected_id=$(sed -n 's/^applicationId=//p' "$identity")
          expected_name=$(sed -n 's/^displayName=//p' "$identity")
          actual_id=$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" <<<"$badging")
          actual_name=$(sed -n "s/^application-label:'\(.*\)'$/\1/p" <<<"$badging")
          echo "Identity file: $expected_id, $expected_name"
          echo "Built app: $actual_id, $actual_name"
          test -n "$expected_id" && test -n "$expected_name"
          test "$actual_id" = "$expected_id" && test "$actual_name" = "$expected_name"
      - name: Allow runner access to KVM
        run: sudo chmod a+rw /dev/kvm
      - name: Exercise the Kotlin binding and Compose UI
        uses: reactivecircus/android-emulator-runner@5d6e86df22ab11632167a1a6b0c9ab0dc3469586 # v2.36.0
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          script: |
            adb shell cmd uimode night no
            scripts/build-android.sh :app:connectedDebugAndroidTest
            adb shell cmd uimode night yes
            scripts/build-android.sh :app:connectedDebugAndroidTest --rerun-tasks
